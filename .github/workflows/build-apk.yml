name: 테스트용 APK 빌드 (정식 서명)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 패키지 설치
        run: npm install

      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: gradlew 실행 권한 부여
        run: chmod +x android/gradlew

      - name: 웹 자산 동기화
        run: npx cap sync android

      - name: 서명 키 파일 복원
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-key.jks"

      - name: 정식(릴리스) APK 빌드 (업로드 키로 서명)
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 서명 키 파일 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: youngsaeng-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
